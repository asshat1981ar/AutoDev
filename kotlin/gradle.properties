# AutoDev Kotlin Gradle Properties
# Centralized Gradle configuration for all AutoDev Kotlin modules.
#
# Usage:
#   This file is automatically picked up by Gradle when placed in:
#   - The project root (for project-wide settings)
#   - The Gradle user home directory (~/.gradle/gradle.properties)
#
# For AutoDev, place a symlink or copy in kotlin/ directory or use:
#   ./gradlew build -Pkotlin.code.style=official --no-daemon
#
# Priority: Project gradle.properties > This file > Gradle defaults

# =============================================================================
# GRADLE BEHAVIOR
# =============================================================================

# Always use the wrapper - never use system Gradle
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Parallel builds for faster CI
org.gradle.parallel=true
org.gradle.workers.max=4

# Configure on demand - only build what's needed
org.gradle.configureondemand=true

# Enable caching
org.gradle.caching=true

# =============================================================================
# KOTLIN VERSIONS
# =============================================================================

# Kotlin version - matches AGENTS.md specification
kotlin.version=2.0.21

# Kotlin compiler flags for stricter checks
kotlin.compiler.execution.strategy=in-process
kotlin.compiler.incremental.compiler.parallel=false
kotlin.code.style=official

# =============================================================================
# JVM TOOLCHAIN
# =============================================================================

# JDK 17 - matches AGENTS.md specification
org.gradle.java.home=$JDK_17_HOME
jvm.target=17

# =============================================================================
# ANDROID CONFIGURATION (for android-command-center)
# =============================================================================

# Android SDK - matches AGENTS.md specification
android.compileSdkVersion=35
android.minSdkVersion=26
android.targetSdkVersion=35
android.buildToolsVersion=35.0.0

# Disable Gradle metadata generation for Android (faster builds)
android.enableBuildCache=true
android.enableJetifier=false
android.useAndroidX=true

# =============================================================================
# KTLINT CONFIGURATION
# =============================================================================

# ktlint version - matches AGENTS.md specification
ktlint.version=12.1.1

# =============================================================================
# DEPENDENCY VERSIONS
# =============================================================================

# Keep dependencies deterministic
ktlint.version=12.1.1

# =============================================================================
# REPOSITORIES
# =============================================================================

# Repositories - handled in settings.gradle.kts, but documented here
# mavenCentral()
# google()
# gradlePluginPortal()

# =============================================================================
# CI-SPECIFIC OVERRIDES
# =============================================================================

# In CI, disable daemon and use more memory
if (System.getenv("CI") == "true") {
    org.gradle.daemon=false
}

# Local development may want daemon for faster incremental builds
# Set in local gradle.properties: org.gradle.daemon=true
kotlin.native.ignoreDisabledTargets=true
