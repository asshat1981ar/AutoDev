# AutoDev Kotlin Multiplatform build properties.

# Suppress the noisy "Kotlin/Native targets cannot be built on this machine"
# warning on hosts without the iOS toolchain; the targets are still built on
# macOS CI runners where the toolchain is available.
kotlin.native.ignoreDisabledTargets=true

# Android command-center dependencies use AndroidX.
android.useAndroidX=true

# Avoid the deprecated-features warning under Gradle 9.
org.gradle.configuration-cache=false
