# AutoDev Ktlint Configuration
# Centralized Kotlin linting rules for all AutoDev Kotlin code.
#
# Usage:
#   Symlink this file to kotlin/.ktlint.yaml or each module's directory
#   Or pass via command line: ktlint --editorconfig-override .ktlint.yaml
#
# Priority: Project .ktlint.yaml > This file > ktlint defaults

# =============================================================================
# EDITORCONFIG SETTINGS
# =============================================================================

editorconfig:
  # Match Rust and other language configs for consistency
  indent_size: 2
  indent_style: space
  max_line_length: 100
  trim_trailing_whitespace: true
  insert_final_newline: true
  end_of_line: lf
  charset: utf-8

# =============================================================================
# RULE SETS
# =============================================================================

# Enable standard rule set
disabled_rules:
  # Allow wildcard imports in test code
  - "no-wildcard-imports"

enabled_rules:
  # Standard style rules
  - "no-wildcard-imports"
  - "no-multi-spaces"
  - "no-trailing-spaces"
  - "no-empty-class-body"

rules:
  # Indentation
  indent:
    auto-correction: true
    size: 2

  # Line length
  line-length:
    max: 100
    allow-wrapping-always: false

  # No wildcard imports (except in test files)
  no-wildcard-imports:
    active: true
    allow:
      - "import org.junit.*"
      - "import kotlin.test.*"

  # Naming conventions
  naming:
    class:
      pattern: "[A-Z][a-zA-Z0-9]*"
    function:
      pattern: "[a-z][a-zA-Z0-9]*"
      allow_backticks: true
    variable:
      pattern: "[a-z][a-zA-Z0-9]*"
      allow_backticks: true
    constant:
      pattern: "[A-Z][A-Z0-9_]*"
    package:
      pattern: "[a-z][a-z0-9.]*"

  # File organization
  file-naming:
    pattern: "[A-Z][a-zA-Z0-9]*"
    extension: "kt"

  # Import ordering
  imports:
    layout: "star,com.google,com,org,java,javax,kotlin"
    ignore-public-api: false

# =============================================================================
# ANDROID-SPECIFIC (for android-command-center)
# =============================================================================

android:
  # Android allows different conventions
  naming:
    class:
      pattern: "[A-Z][a-zA-Z0-9]*"
    variable:
      pattern: "[a-z][a-zA-Z0-9]*"

# =============================================================================
# COMMONMAIN PURITY RULES
# =============================================================================

# Custom rules for Kotlin Multiplatform commonMain purity
# These would be implemented as custom ktlint rules or in code review

# Flag usage of platform-specific types in commonMain
# This is enforced via AGENTS.md section 5: "Preserve commonMain purity"
# and checked in code review per .coderabbit.yaml

# The following patterns should fail in commonMain:
# - java.* types
# - javax.* types
# - android.* types
# - Any Darwin/iOS specific types

