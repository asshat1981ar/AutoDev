# AutoDev Unittest Configuration
# Configuration for Python's unittest framework.
#
# Usage:
#   python -m unittest discover -s tests -v -c config/python/unittest.ini
#
# Per AGENTS.md section 3 and 6, this is the primary test runner.
# pytest.ini is provided for compatibility but unittest is canonical.
#
# Priority: Command line > This file > unittest defaults

[unittest]
# Test discovery
# Per AGENTS.md: python -m unittest discover -s tests -v
start_directory = tests
pattern = test_*.py

# Verbose output - matches AGENTS.md requirement
verbosity = 2

# =============================================================================
# OUTPUT FORMATTING
# =============================================================================

# Show dots for each test
# verbose = 2 (already set above)

# =============================================================================
# FAILURE REPORTING
# =============================================================================

# Show full diff on assertion failures
failfast = false

# Show the full traceback
catchbreak = false

# =============================================================================
# LOADERS & RUNNERS
# =============================================================================

# Use the standard loader and runner
loader = unittest.TestLoader
runner = unittest.TextTestRunner

# =============================================================================
# DISCOVERY FILTERING
# =============================================================================

# Only discover test files matching the pattern
# This is already handled by the pattern above

# =============================================================================
# AUTODEV-SPECIFIC
# =============================================================================

# Per AGENTS.md section 6:
# "Every Python/fabric change: python -m py_compile + python -m unittest discover -s tests -v must pass"
# This configuration ensures that exact command works as expected.

# Required: All tests must pass
# Required: All tests must be deterministic (no network, no randomness)
# Required: Test names must match the discovery pattern

# Test categories that must be present:
# - tests/test_*.py - Unit tests for fabric components
# - tests/test_cline_*.py - Cline fabric tests
# - tests/test_hooks.py - Hook tests

# =============================================================================
# ENVIRONMENT
# =============================================================================

# Tests should not rely on environment variables
# except those explicitly set in CI or documented in AGENTS.md
# If environment is needed, it should be set in the test itself

# Known allowed environment variables:
# - AUTODEV_PORT (for server tests)
# - GITHUB_WEBHOOK_SECRET (for webhook tests)
# - AUTODEV_MCP_BEARER_TOKEN (for MCP tests)
# - AUTODEV_MCP_ALLOWED_HOSTS (for MCP tests)
