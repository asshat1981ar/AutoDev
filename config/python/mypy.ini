# AutoDev Mypy Configuration
# Centralized type checking configuration for AutoDev Python code.
#
# Usage:
#   mypy --config-file config/python/mypy.ini scripts/ install.py
#   mypy --config-file config/python/mypy.ini .cline/hooks/*.py
#
# Note: Per AGENTS.md section 4, Python code uses stdlib only.
# No external dependencies (numpy, pandas, etc.) are allowed without ADR.
#
# Priority: Project mypy.ini > This file > mypy defaults

[mypy]
# Python version - matches AGENTS.md specification (3.10 or 3.11)
python_version = 3.10

# Output verbosity
show_error_codes = True
show_column_numbers = True
show_error_context = True
pretty = True

# =============================================================================
# STRICTNESS SETTINGS
# =============================================================================

# Start with strict checking
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_no_return = True
warn_unreachable = True

# Disable for now - too many false positives in stdlib
# strict = True
# disallow_untyped_defs = True
# disallow_incomplete_defs = True
# disallow_untyped_calls = True

# =============================================================================
# ERROR HANDLING
# =============================================================================

# Ensure proper error handling
warn_no_return = True
warn_return_any = True

# =============================================================================
# TYPE IGNORING
# =============================================================================

# stdlib modules that don't have type stubs
# Per AGENTS.md, we use stdlib only, but some modules lack types
ignore_missing_imports = True

# =============================================================================
# PER-FILE OVERRIDES
# =============================================================================

# Generated or dynamic code may need different settings
[myoverrides]

# Cline hooks may use dynamic patterns
[myoverrides:file:.cline/hooks/*.py]
ignore_missing_imports = True

# MCP and external integrations
[myoverrides:file:.cline/mcp/*.py]
ignore_missing_imports = True

# =============================================================================
# PLUGINS
# =============================================================================

# No external plugins - stdlib only per AGENTS.md
# plugins = 

# =============================================================================
# REPORTING
# =============================================================================

# Generate reports for CI
txt_report = True
xml_report = True

# =============================================================================
# AUTODEV-SPECIFIC RULES
# =============================================================================

# Flag patterns that violate trust boundaries
# These would be better as custom ast-grep rules

# No direct shell execution without approval
# detect: subprocess.run, subprocess.Popen, os.system

# No direct file writes to forbidden paths
# detect: open("secrets/", "w"), open("*.pem", "w")

# No authorization grant creation in CLI
# detect: AuthorizationGrant, forge_core (in scripts/autodev-cli.py)
