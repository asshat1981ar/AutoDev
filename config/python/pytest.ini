# AutoDev Pytest Configuration
# Centralized test configuration for AutoDev Python code.
#
# Usage:
#   python -m pytest --pytest.ini config/python/pytest.ini
#   python -m pytest -c config/python/pytest.ini
#
# Per AGENTS.md, tests use unittest stdlib, but pytest is used for discovery.
#
# Priority: Project pytest.ini > This file > pytest defaults

[pytest]
# Test discovery
# tests/ directory is the canonical test location per AGENTS.md
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Verbose output for CI visibility
addopts = -v --tb=short --durations=10

# Show the full traceback on failures
showlocals = true

# =============================================================================
# MARKERS
# =============================================================================

# AutoDev-specific test markers
markers =
    slow: Mark test as slow-running
    integration: Integration test requiring external dependencies
    unit: Unit test (fast, isolated)
    security: Security-boundary test
    harness: Harness enforcement test
    ci: CI-only test

# =============================================================================
# FILTERING
# =============================================================================

# Skip slow tests by default
filterwarnings = 
    error::DeprecationWarning
    error::RuntimeWarning

# =============================================================================
# OUTPUT
# =============================================================================

# JUnit XML output for CI
junit_family = xunit2
junit_logging = all
junit_log_passing_tests = true

# Console output
console_output_style = classic

# =============================================================================
# PARALLELIZATION
# =============================================================================

# Run tests in parallel for speed
addopts = -n auto

# Maximum workers (override auto if needed)
max_failures = 5

# =============================================================================
# REPORTING
# =============================================================================

# Generate coverage report
# Note: Coverage requires pytest-cov which is NOT in stdlib
# For now, we rely on unittest's built-in reporting
# addopts = --cov=autodev --cov-report=xml

# =============================================================================
# AUTODEV-SPECIFIC SETTINGS
# =============================================================================

# Per AGENTS.md section 6: tests must be deterministic (no network)
# Flag any test that makes network calls
python_functions = test_* no_network_*

# Tests that are allowed to be slow
# These are explicitly marked and can be skipped in quick runs
# addopts = -m "not slow"

# =============================================================================
# FILE PATTERNS
# =============================================================================

# Test files to include
python_classes = Test*
python_functions = test_* should_* check_*

# Ignore patterns
ignore = build/ __pycache__/ .venv/ .git/ target/

# =============================================================================
# TIMEOUTS
# =============================================================================

# Global test timeout (seconds)
timeout = 60
# Slow test timeout (seconds)
timeout_method = xdist
timeout_default = 300
