# AutoDev GitHub Actions Environment Configuration
# Centralized environment variables and settings for GitHub Actions CI.
#
# Usage:
#   These values are referenced in .github/workflows/ci.yml
#   They are also used as defaults for local development
#
# Priority: Workflow file > This file > GitHub defaults

# =============================================================================
# GLOBAL ENVIRONMENT VARIABLES
# =============================================================================

env:
  # Gradle - matches AGENTS.md specification
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_VERSION: 8.10.2
  
  # Cargo - matches AGENTS.md specification
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable
  
  # Node - matches AGENTS.md specification
  NODE_VERSION: 24
  
  # Python - matches AGENTS.md specification
  PYTHON_VERSION: "3.11"
  
  # Port configuration
  AUTODEV_PORT: "8080"
  
  # GitHub Actions specific
  ACTIONS_ALLOW_UNSECURE_COMMANDS: "false"
  ACTIONS_STEP_DEBUG: "false"

# =============================================================================
# JOB-SPECIFIC MATRIX
# =============================================================================

matrix:
  # Rust jobs
  rust:
    toolchain: [stable]
    components: [rustfmt, clippy]
    
  # Kotlin jobs
  kotlin:
    java_version: ["17"]
    
  # Python jobs
  python:
    python_version: ["3.10", "3.11"]
    
  # Node jobs
  node:
    node_version: ["24"]

# =============================================================================
# SECRETS REFERENCE
# =============================================================================

# These secrets are used in CI but NOT committed to the repository
# They must be configured in GitHub repository settings

secrets:
  required:
    - GITHUB_WEBHOOK_SECRET
    - AUTODEV_MCP_BEARER_TOKEN
    - AUTODEV_MCP_ALLOWED_HOSTS
  
  optional:
    - SONAR_TOKEN
    - CODECOV_TOKEN
    - DOCKER_HUB_USERNAME
    - DOCKER_HUB_TOKEN

# =============================================================================
# ARTIFACT CONFIGURATION
# =============================================================================

artifacts:
  # Build outputs
  rust:
    name: autodev-server-release
    path: crates/target/release/autodev-server
    
  kotlin:
    name: autodev-command-center-debug
    path: kotlin/android-command-center/build/outputs/apk/debug/android-command-center-debug.apk
    
  # Test reports
  reports:
    name: test-reports
    path: |
      crates/target/**/junit.xml
      kotlin/**/build/reports/**
      test-results/**

# =============================================================================
# CACHE CONFIGURATION
# =============================================================================

cache:
  rust:
    key: cargo-${{ runner.os }}-${{ hashFiles('crates/**/Cargo.toml', 'crates/Cargo.toml') }}
    restore-keys: |
      cargo-${{ runner.os }}-
    paths: |
      ~/.cargo/bin/
      ~/.cargo/registry/index/
      ~/.cargo/registry/cache/
      ~/.cargo/git/db/
      crates/target/
    
  kotlin:
    key: gradle-${{ runner.os }}-${{ hashFiles('kotlin/**/*.gradle.kts', 'kotlin/gradle/wrapper/gradle-wrapper.properties') }}
    restore-keys: |
      gradle-${{ runner.os }}-
    paths: |
      ~/.gradle/caches/
      ~/.gradle/wrapper/
      kotlin/.gradle/
    
  python:
    key: python-${{ runner.os }}-${{ hashFiles('scripts/**', '.cline/**') }}
    restore-keys: |
      python-${{ runner.os }}-
    paths: |
      ~/.cache/pip/
      .venv/
    
  node:
    key: node-${{ runner.os }}-${{ hashFiles('scripts/**') }}
    restore-keys: |
      node-${{ runner.os }}-
    paths: |
      ~/.npm
      ~/.cache/node/

# =============================================================================
# CONTAINER CONFIGURATION
# =============================================================================

container:
  rust:
    image: rust:bookworm
    
  runtime:
    image: debian:bookworm-slim
    
  # Docker build arguments
  args:
    RUST_VERSION: stable
    GRADLE_VERSION: 8.10.2
    JDK_VERSION: 17

# =============================================================================
# NOTIFICATION CONFIGURATION
# =============================================================================

notifications:
  slack:
    enabled: false
    channel: "#autodev-ci"
    
  email:
    enabled: false
    recipients:
      - "autodev@github.com"
    
  github:
    enabled: true
    commit_status: true

# =============================================================================
# DEPLOYMENT CONFIGURATION
# =============================================================================

deployment:
  # Container registry
  registry: ghcr.io
  image_name: autodev-server
  
  # Version tags
  tags:
    - latest
    - "${{ github.sha }}"
    - "${{ github.ref_name }}"
    
  # Platforms
  platforms: |
    linux/amd64
    linux/arm64
