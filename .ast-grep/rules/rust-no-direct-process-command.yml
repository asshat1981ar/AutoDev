id: forgecore-no-direct-process-command
language: Rust
files:
  - crates/forge-core/src/**/*.rs
rule:
  any:
    - pattern: std::process::Command::new($PROGRAM)
    - all:
        - pattern: Command::new($PROGRAM)
        - inside:
            kind: source_file
            stopBy: end
            has:
              stopBy: end
              pattern: use std::process::Command;
message: Direct process execution in ForgeCore requires trusted-boundary review.
severity: warning
