name: One-shot evaluator minimal lock resolver

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  resolve:
    if: github.head_ref == 'feat/self-evaluation-factory-v0' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve minimally from main lockfile
        run: |
          git checkout origin/main -- crates/Cargo.lock
          cd crates
          cargo check --workspace --all-targets --all-features
          cargo check --locked --workspace --all-targets --all-features
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/Cargo.lock
          git commit -m "chore(eval): resolve minimal workspace lockfile"
          git push origin HEAD:${{ github.head_ref }}
