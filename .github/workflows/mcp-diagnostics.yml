name: MCP Diagnostics
on:
  push:
    branches: [autodev/polyglot-stateless-mcp-red]
permissions:
  contents: write
jobs:
  diagnose:
    if: ${{ !startsWith(github.event.head_commit.message, 'diagnostics(auto):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture compiler output
        working-directory: crates
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings > ../mcp-clippy.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "autodev-diagnostics[bot]"
          git config user.email "autodev-diagnostics[bot]@users.noreply.github.com"
          git add mcp-clippy.txt
          git commit -m "diagnostics(auto): capture MCP clippy output"
          git push origin "HEAD:${GITHUB_REF_NAME}"
