name: claude

# Tag mode: answers "@claude ..." from the repository owner on issues, PRs and reviews.
# Needs secret CLAUDE_CODE_OAUTH_TOKEN and the Claude GitHub App (see docs/claude-automation.md).
on:
  # zizmor: ignore[dangerous-triggers] -- job is gated to github.repository_owner; checkout is the default branch and PR code is never executed
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    # Bare expressions only, owner-only as defence in depth on a public repo.
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # push claude/* branches
      pull-requests: write
      issues: write
      actions: read # mcp__github_ci__* tools
      id-token: write # Claude GitHub App token exchange (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          branch_prefix: "claude/"
          include_comments_by_actor: "asshat1981ar,coderabbitai[bot]"
          exclude_comments_by_actor: "dependabot[bot],renovate[bot]"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 50
            --allowedTools "Bash(cargo fmt --manifest-path crates/Cargo.toml:*),Bash(cargo clippy --locked --manifest-path crates/Cargo.toml:*),Bash(cargo build --locked --manifest-path crates/Cargo.toml:*),Bash(cargo test --locked --manifest-path crates/Cargo.toml:*),Bash(./kotlin/gradlew -p kotlin:*),Bash(python -m py_compile:*),Bash(python -m unittest discover -s tests -v),Bash(python scripts/check_harness_drift.py:*),Bash(python scripts/validate_pr_evidence.py:*),Bash(python scripts/validate_toolset_memory.py:*),Bash(corepack enable:*),Bash(pnpm install --frozen-lockfile),Bash(pnpm typecheck),Bash(pnpm test),Bash(node --check scripts/termux-kanban.mjs),Bash(node scripts/termux-kanban.mjs --check),Bash(git status),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(npm install:*),Bash(yarn:*),Bash(pip install:*),Bash(docker:*),Bash(gh api:*),Bash(cargo update:*),Bash(git push --force*)"
            --append-system-prompt "CI context. Follow AGENTS.md. Never create root Cargo.toml/pyproject.toml/requirements.txt or kotlin/gradle/libs.versions.toml. Never touch crates/Cargo.lock except via an explicit task. After edits run python scripts/check_harness_drift.py and the gates for the touched area (AGENTS.md section 6). In your final comment include a 'Commands run' and 'Evidence' block in the PR-template format."
