name: claude

# Tag mode: answers "@claude ..." from the repository owner on issues, PRs and reviews.
# Needs secret CLAUDE_CODE_OAUTH_TOKEN and the Claude GitHub App (see docs/claude-automation.md).
# Safety model: owner-only; cross-repo (fork) PRs are refused before Claude starts; Claude gets
# read-only git/gh tools and the action's file/commit tools, no build, test or repo-script
# commands, so CI (which runs on its pushes without secrets) provides test results.
# Residual risk: a same-repo branch can still carry hostile text (for example AGENTS.md, which
# the action does not restore from base) that Claude reads as instructions.
on:
  # zizmor: ignore[dangerous-triggers] -- owner-gated trigger; cross-repo PRs refused by the fork step; no PR code executed (no build/test tools allowlisted); env scrub on
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    # Bare expressions only, owner-only as defence in depth on a public repo.
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # push claude/* branches
      pull-requests: write
      issues: write
      actions: read # mcp__github_ci__* tools
      id-token: write # Claude GitHub App token exchange (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Fail closed: any error means cross=true and Claude does not run.
      - name: Refuse cross-repository PRs
        id: fork
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
        run: |
          cross=true
          if [ "$IS_PR" != "true" ]; then
            cross=false
          elif v="$(gh pr view "$PR" --repo "$REPO" --json isCrossRepository -q .isCrossRepository)" && [ "$v" = "false" ]; then
            cross=false
          fi
          echo "cross=$cross" >> "$GITHUB_OUTPUT"
          [ "$cross" = "false" ] || echo "::warning::Cross-repository or unverifiable PR: Claude not started"

      - name: Run Claude Code
        if: steps.fork.outputs.cross != 'true'
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          branch_prefix: "claude/"
          include_comments_by_actor: "asshat1981ar,coderabbitai[bot]"
          exclude_comments_by_actor: "dependabot[bot],renovate[bot]"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 50
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(npm install:*),Bash(yarn:*),Bash(pip install:*),Bash(docker:*),Bash(gh api:*),Bash(cargo update:*),Bash(git push --force*)"
            --append-system-prompt "CI context. AGENTS.md is the harness; its key rules: never create root Cargo.toml/pyproject.toml/requirements.txt or kotlin/gradle/libs.versions.toml, and never touch crates/Cargo.lock except via an explicit task. You have no build, test or script tools here: edit with the file tools, and say that CI (which runs on your push) provides test results. In your final comment list what you changed and what CI must verify, in the PR-template Commands run / Evidence format, marking anything unrun as not run."
