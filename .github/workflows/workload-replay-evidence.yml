name: Workload Replay Evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build release server
        run: cargo build --manifest-path crates/Cargo.toml --release -p autodev-server
      - name: Record runner and binary metadata
        run: |
          mkdir -p performance-evidence
          uname -a > performance-evidence/runner.txt
          nproc >> performance-evidence/runner.txt
          lscpu >> performance-evidence/runner.txt
          stat -c '%s' crates/target/release/autodev-server > performance-evidence/server-size-bytes.txt
      - name: Start Rust server
        env:
          AUTODEV_PORT: '18080'
          AUTODEV_MCP_BEARER_TOKEN: ci-replay-token
        run: |
          crates/target/release/autodev-server > performance-evidence/server.log 2>&1 &
          echo $! > performance-evidence/server.pid
          for attempt in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi
            sleep 0.1
          done
          cat performance-evidence/server.log
          exit 1
      - name: Replay concurrency 1
        env:
          AUTODEV_MCP_BEARER_TOKEN: ci-replay-token
        run: |
          python scripts/workload_replay.py \
            --target http://127.0.0.1:18080 \
            --iterations 300 \
            --warmup-iterations 20 \
            --concurrency 1 \
            --pid "$(cat performance-evidence/server.pid)" \
            --output performance-evidence/rust-c1.json
      - name: Replay concurrency 8
        env:
          AUTODEV_MCP_BEARER_TOKEN: ci-replay-token
        run: |
          python scripts/workload_replay.py \
            --target http://127.0.0.1:18080 \
            --iterations 300 \
            --warmup-iterations 20 \
            --concurrency 8 \
            --pid "$(cat performance-evidence/server.pid)" \
            --output performance-evidence/rust-c8.json
      - name: Replay concurrency 32
        env:
          AUTODEV_MCP_BEARER_TOKEN: ci-replay-token
        run: |
          python scripts/workload_replay.py \
            --target http://127.0.0.1:18080 \
            --iterations 300 \
            --warmup-iterations 20 \
            --concurrency 32 \
            --pid "$(cat performance-evidence/server.pid)" \
            --output performance-evidence/rust-c32.json
      - name: Stop server
        if: always()
        run: |
          if [ -f performance-evidence/server.pid ]; then
            kill "$(cat performance-evidence/server.pid)" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-workload-replay-evidence
          path: performance-evidence
          if-no-files-found: error
