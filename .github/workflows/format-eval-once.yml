name: One-shot evaluator rustfmt

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  rustfmt:
    if: github.head_ref == 'feat/self-evaluation-factory-v0' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt and remove one-shot workflow
        working-directory: crates
        run: |
          cargo fmt --all
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-eval-once.yml
          git add crates
          git commit -m "style(eval): apply rustfmt"
          git push origin HEAD:${{ github.head_ref }}
