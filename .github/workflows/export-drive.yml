name: Export repository snapshot

on:
  push:
    branches:
      - audit/round-2-1-foundation
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create repository snapshot
        run: |
          git archive --format=zip --output=AutoDev-audit-round-2-1-foundation.zip HEAD
          sha256sum AutoDev-audit-round-2-1-foundation.zip > AutoDev-audit-round-2-1-foundation.zip.sha256
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: AutoDev-audit-round-2-1-foundation
          path: |
            AutoDev-audit-round-2-1-foundation.zip
            AutoDev-audit-round-2-1-foundation.zip.sha256
          if-no-files-found: error
          retention-days: 30
