name: Rust

on:
  push:
    paths:
      - "crates/**"
      - "protocols/**"
      - "tests/**"
      - "scripts/**"
      - ".cline/**"
      - "install.py"
      - "bootstrap_cline_mcp.py"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "protocols/**"
      - "tests/**"
      - "scripts/**"
      - ".cline/**"
      - "install.py"
      - "bootstrap_cline_mcp.py"
      - ".github/workflows/rust.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compile Python entry points
        run: python -m py_compile install.py bootstrap_cline_mcp.py .cline/hooks/*.py .cline/plugins/project-fabric/tools.py
      - name: Validate Termux Kanban launcher
        run: |
          node --check scripts/termux-kanban.mjs
          node scripts/termux-kanban.mjs --check
      - name: Test Cline development fabric
        run: python -m unittest discover -s tests -v
