name: AMCX v1.1 bootstrap

on:
  push:
    branches:
      - feat/amcx1-v1.1-integration
    paths:
      - .github/workflows/amcx-v1.1-bootstrap.yml

permissions:
  contents: write

jobs:
  import-amcx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/amcx1-v1.1-integration
          fetch-depth: 0

      - name: Download verified AMCX v1.1 release
        shell: bash
        run: |
          set -euo pipefail
          url='https://drive.usercontent.google.com/download?id=16iuoIXcQ0WznczuKxkTHvNmOIG77Z4jn&export=download&confirm=t'
          curl --fail --location --retry 3 --output /tmp/amcx-v1.1.zip "$url"
          echo '4b5abb663b8fe2eb3fe3f4804bbdf2dc14244409eea3e457befa426136fb3986  /tmp/amcx-v1.1.zip' | sha256sum --check --strict

      - name: Import under protocols/amcx
        shell: bash
        run: |
          set -euo pipefail
          rm -rf protocols/amcx
          mkdir -p protocols/amcx
          unzip -q /tmp/amcx-v1.1.zip -d protocols/amcx
          find protocols/amcx -type d -name __pycache__ -prune -exec rm -rf {} +
          find protocols/amcx -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Verify imported AMCX release
        shell: bash
        run: |
          set -euo pipefail
          bash protocols/amcx/scripts/run_verification.sh

      - name: Commit provenance-preserving import
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .amcx-bootstrap
          rm -f .github/workflows/amcx-v1.1-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A protocols/amcx .amcx-bootstrap .github/workflows/amcx-v1.1-bootstrap.yml
          git commit -m 'feat(amcx): import verified AMCX-1 v1.1 release'
          git push origin HEAD:feat/amcx1-v1.1-integration
