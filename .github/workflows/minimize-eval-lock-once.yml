name: One-shot evaluator lockfile minimizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  minimize:
    if: github.head_ref == 'feat/self-evaluation-factory-v0' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore main resolution and add only evaluator workspace entry
        run: |
          git checkout origin/main -- crates/Cargo.lock
          cd crates
          cargo metadata --no-deps --format-version 1 >/dev/null
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/Cargo.lock
          git commit -m "chore(eval): minimize workspace lockfile diff"
          git push origin HEAD:${{ github.head_ref }}
