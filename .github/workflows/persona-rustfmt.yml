name: Persona Rustfmt
on:
  push:
    branches: [autodev/polyglot-simulation]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'style(auto):') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - working-directory: .
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "autodev-rustfmt[bot]"
          git config user.email "autodev-rustfmt[bot]@users.noreply.github.com"
          git add crates
          git commit -m "style(auto): apply rustfmt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
