name: Web CLI RED
on:
  push:
    branches: [autodev/web-cli-command-center]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run command-center contract tests
        run: python -m unittest tests.test_command_center_clients -v
