name: CI

on:
  push:
    branches: [main, merge/kotlin-mpp]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  rust:
    name: Rust - fmt, clippy, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  kotlin:
    name: Kotlin - build, test, ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('kotlin/**/*.gradle.kts', 'kotlin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build & test JVM targets
        working-directory: kotlin
        run: ./gradlew clean assemble test --no-daemon
      - name: ktlint
        working-directory: kotlin
        run: ./gradlew ktlintCheck --no-daemon

  python:
    name: Python - compile & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile entry points
        run: python -m py_compile install.py bootstrap_cline_mcp.py .cline/hooks/*.py .cline/plugins/project-fabric/tools.py
      - name: Test Cline development fabric
        run: python -m unittest discover -s tests -v
      - name: Validate Termux Kanban launcher
        run: |
          node --check scripts/termux-kanban.mjs
          node scripts/termux-kanban.mjs --check
