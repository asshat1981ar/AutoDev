name: CI

on:
  push:
    branches: [main, merge/kotlin-mpp]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  rust:
    name: Rust - fmt, clippy, build, test, container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Build server container
        run: docker build -f ../Dockerfile -t autodev-server:ci ..

  kotlin:
    name: Kotlin - build, test, ktlint, APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('kotlin/**/*.gradle.kts', 'kotlin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build KMP targets, tests, and debug APK
        working-directory: kotlin
        run: |
          ./gradlew clean test \
            :mpp-core:assemble \
            :mpp-server:assemble \
            :mpp-ui:assemble \
            :mpp-codegraph:assemble \
            :android-command-center:assembleDebug \
            --no-daemon
      - name: ktlint
        working-directory: kotlin
        run: ./gradlew ktlintCheck --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: autodev-command-center-debug
          path: kotlin/android-command-center/build/outputs/apk/debug/android-command-center-debug.apk
          if-no-files-found: error

  python:
    name: Python - compile & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile entry points
        run: python -m py_compile install.py bootstrap_cline_mcp.py .cline/hooks/*.py .cline/plugins/project-fabric/tools.py
      - name: Test Cline development fabric
        run: python -m unittest discover -s tests -v
      - name: Validate Termux Kanban launcher
        run: |
          node --check scripts/termux-kanban.mjs
          node scripts/termux-kanban.mjs --check
