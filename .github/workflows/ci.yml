name: CI

on:
  push:
    branches: [main, merge/kotlin-mpp]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch: {}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  rust:
    name: Rust - fmt, clippy, build, test, container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --locked --workspace
      - name: Test
        run: cargo test --locked --workspace
      - name: Build server container
        run: docker build -f ../Dockerfile -t autodev-server:ci ..

  kotlin:
    name: Kotlin - build, test, ktlint, APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('kotlin/**/*.gradle.kts', 'kotlin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build KMP targets, tests, and debug APK
        working-directory: kotlin
        run: |
          ./gradlew clean test \
            :mpp-core:assemble \
            :mpp-server:assemble \
            :mpp-ui:assemble \
            :mpp-codegraph:assemble \
            :android-command-center:assembleDebug \
            --no-daemon
      - name: ktlint
        working-directory: kotlin
        run: ./gradlew ktlintCheck --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: autodev-command-center-debug
          path: kotlin/android-command-center/build/outputs/apk/debug/android-command-center-debug.apk
          if-no-files-found: error

  harness:
    name: Harness - drift, reproducible gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked ast-grep
        working-directory: tools/ast-grep
        run: npm ci --no-audit --no-fund
      - name: ast-grep rule regressions
        env:
          AST_GREP_BIN: ${{ github.workspace }}/tools/ast-grep/node_modules/.bin/ast-grep
        run: bash tests/test_ast_grep_rules.sh
      - name: CodeRabbit follow-up regressions
        env:
          AST_GREP_BIN: ${{ github.workspace }}/tools/ast-grep/node_modules/.bin/ast-grep
        run: bash tests/test_coderabbit_followups.sh
      - name: Validate submitted PR evidence
        if: github.event_name == 'pull_request'
        run: python scripts/validate_pr_evidence.py "$GITHUB_EVENT_PATH"
      - name: Harness drift (docs ↔ CI)
        run: python scripts/check_harness_drift.py --verbose
      - name: Reproducible verification (offline-capable)
        run: bash scripts/verify_reproducible.sh

  python:
    name: Python - compile & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile entry points
        run: python -m py_compile install.py bootstrap_cline_mcp.py scripts/validate_toolset_memory.py scripts/validate_pr_evidence.py .cline/hooks/*.py .cline/plugins/project-fabric/tools.py
      - name: Validate toolset learning memory
        run: python scripts/validate_toolset_memory.py memory/toolsets/patterns.jsonl
      - name: Test Cline development fabric
        run: python -m unittest discover -s tests -v
      - name: Validate Termux Kanban launcher
        run: |
          node --check scripts/termux-kanban.mjs
          node scripts/termux-kanban.mjs --check

  evaluation:
    name: Self-evaluation corpus smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate evaluation corpus
        working-directory: crates
        run: cargo run --locked -p autodev-eval -- validate --fixtures autodev-eval/fixtures
      - name: Run historical reference smoke
        env:
          AUTODEV_EVAL_SOURCE_REPO: ${{ github.workspace }}
        working-directory: crates
        run: cargo test --locked -p autodev-eval --test corpus_smoke -- --ignored --nocapture

  amcx1:
    name: AMCX-1 - memory state compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate AMCX-1 .vibe state (skips when absent)
        run: python scripts/check_harness_drift.py --amcx1 --verbose
