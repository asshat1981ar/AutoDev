name: claude-review

# Kernel-path review. CodeRabbit already reviews every PR, so Claude only runs when the PR
# touches security-relevant paths, or carries the "claude-review" label. Relevance is decided
# inside the job (no paths: filter), so the label works on any PR. Advisory, never a required check.
# Claude is read-only: no build/test/script tools. CodeRabbit comments are pre-fetched by a
# deterministic step (author-filtered) because comment filters do not apply in agent mode.
# Claude has no comment-writing Bash tool: inline comments use the action's MCP tool; its general summary comes
# back as structured_output and a deterministic step upserts one marker comment. Read-only review on the workflow
# GITHUB_TOKEN (never pushes), so no App token and no id-token.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]
    branches: [main]

permissions: {}

jobs:
  review:
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write # inline review comments and the summary comment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Decide relevance and fetch CodeRabbit comments
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'claude-review') }}
        run: |
          set -euo pipefail
          relevant=false
          files=""
          if ! files="$(gh pr diff "$PR" --repo "$REPO" --name-only)"; then
            echo "::warning::gh pr diff failed; kernel-path relevance could not be decided"
            files=""
          fi
          if [ "$HAS_LABEL" = "true" ]; then
            relevant=true
          elif printf '%s\n' "$files" | grep -Eq '^(crates/forge-core/|crates/autodev-server/|protocols/amcx/|kotlin/.*/src/commonMain/|schemas/|policies/)'; then
            relevant=true
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [ "$relevant" != "true" ]; then
            echo "Not relevant: no kernel paths changed and no claude-review label." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          d="$RUNNER_TEMP/coderabbit"
          mkdir -p "$d"
          {
            gh api --paginate "repos/$REPO/pulls/$PR/comments"
            gh api --paginate "repos/$REPO/pulls/$PR/reviews"
          } | jq -s '[.[][] | select(.user.login == "coderabbitai[bot]") | {url: .html_url, path: (.path // null), body: ((.body // "")[:4000])}] | .[:200]' > "$d/coderabbit-comments.json"

      - name: Review with Claude
        id: review
        if: steps.rel.outputs.relevant == 'true'
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*)"
            --add-dir ${{ runner.temp }}/coderabbit
            --disallowedTools "Edit,MultiEdit,Write,WebFetch,WebSearch,Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh api:*),Bash(gh pr comment:*)"
            --json-schema '{"type":"object","required":["summary"],"properties":{"summary":{"type":"string","maxLength":6000}}}'

      - name: Post the review summary
        # No verdict (limit hit, error, cancelled) means no comment; the review is advisory and never a gate.
        if: ${{ !cancelled() && steps.review.outputs.structured_output != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_JSON: ${{ steps.review.outputs.structured_output }}
        run: |
          set -euo pipefail
          if ! summary="$(jq -er '.summary | strings' <<<"$REVIEW_JSON")"; then
            echo "::warning::Claude returned no usable summary; nothing posted"
            exit 0
          fi
          f="$RUNNER_TEMP/review-summary.md"
          { echo '<!-- claude-review-summary -->'; echo '## Claude kernel-path review (advisory)'; echo; printf '%s\n' "${summary:0:6000}"; } > "$f"
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- claude-review-summary -->"))) | .id' | head -1)" || id=""
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$f" >/dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$f"
          fi
