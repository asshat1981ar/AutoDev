# Hosts that jobs on GitHub's egress-firewall runner (runs-on: ubuntu-24.04-firewall)
# may reach. Opt in by setting the repository variable CLAUDE_RUNNER=ubuntu-24.04-firewall.
# All other hosts are blocked, apart from any that GitHub's firewall allows by default.
# Add a host only when a workflow step needs it, name it in full (no '*'), and say what uses it.
mode: enforce
allow:
  # Claude API and trading the workflow's GitHub identity token for a short-lived token
  - api.anthropic.com
  # GitHub API: calls made by the Claude Code action and by gh in the review commands
  - api.github.com
  # Claude Code install script, fetched by the Claude Code action
  - claude.ai
  # Claude Code binary, downloaded by the install script
  - downloads.claude.ai
  # Bun and Node.js release downloads used by the action
  - release-assets.githubusercontent.com
  # npm packages (the action's own install; pnpm install for the LiveKit service)
  - registry.npmjs.org
  # Stack hosts below are UNVERIFIED until the first firewall run; trim or extend then.
  # Rust toolchain and crates (cargo build/test)
  - static.rust-lang.org
  - index.crates.io
  - static.crates.io
  # Gradle wrapper, plugins and Maven dependencies (kotlin/gradlew)
  - services.gradle.org
  - plugins.gradle.org
  - repo.maven.apache.org
  - dl.google.com
  - maven.google.com
  # JDK toolchain resolution
  - api.foojay.io
  - api.adoptium.net
