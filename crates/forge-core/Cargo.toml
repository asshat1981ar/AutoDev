[package]
name = "forge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

description = "Trusted execution boundary for AutoDev"

[lib]
name = "forge_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
