services:
  autodev-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: autodev-server:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AUTODEV_PORT: "8080"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
      AUTODEV_MCP_BEARER_TOKEN: "${AUTODEV_MCP_BEARER_TOKEN:-}"
      AUTODEV_MCP_ALLOWED_HOSTS: "${AUTODEV_MCP_ALLOWED_HOSTS:-}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
